<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Coração ❤️</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- coração -->
    <div class="heart"></div>

    <!-- cartão -->
    <div class="card" onclick="mostrarMensagem()">
      <h1>Abrir Meu Coração ❤️</h1>
    </div>

    <!-- mensagem -->
    <p id="mensagem">
      Se existir um lugar chamado felicidade, tenho certeza que ele começa no seu sorriso. Obrigado por estar na minha vida ❤️
    </p>

  </div>

  <!-- música -->
  <audio id="musica">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>

</body>
</html>
