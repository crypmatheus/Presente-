<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meu Cartão ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- coração -->
    <div class="heart"></div>

    <!-- cartão -->
    <div class="card" onclick="mostrarMensagem()">
      <h1>Clique Aqui ❤️</h1>
    </div>

    <!-- mensagem escondida -->
    <p id="mensagem">
      Você é a melhor parte dos meus dias 💖
    </p>

  </div>

  <!-- música -->
  <audio id="musica">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
